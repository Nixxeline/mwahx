<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pink iMessage Generator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ffeff7, #ffd1eb);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .wrap {
      background: #ffffffee;
      backdrop-filter: blur(10px);
      border-radius: 24px;
      max-width: 900px;
      width: 100%;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.12);
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
      overflow: hidden;
    }

    @media (max-width: 768px) {
      .wrap {
        grid-template-columns: 1fr;
      }
    }

    .panel-left {
      padding: 32px 28px;
      border-right: 1px solid #f3c5e2;
    }

    @media (max-width: 768px) {
      .panel-left {
        border-right: none;
        border-bottom: 1px solid #f3c5e2;
      }
    }

    .panel-right {
      padding: 24px;
      background: radial-gradient(circle at top left, #ffe3f5, #ffc4ea);
    }

    .title {
      font-size: 28px;
      font-weight: 800;
      color: #c51c7a;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: #7a3260;
      margin-bottom: 20px;
    }

    .label {
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #a44a7c;
      margin-bottom: 4px;
      font-weight: 600;
    }

    textarea,
    input[type="text"] {
      width: 100%;
      border-radius: 14px;
      border: 1px solid #f1b8dc;
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
      resize: vertical;
      min-height: 80px;
      background: #fff9fd;
      color: #43142f;
    }

    textarea:focus,
    input[type="text"]:focus {
      border-color: #e764b4;
      box-shadow: 0 0 0 2px rgba(231, 100, 180, 0.18);
    }

    .field-group {
      margin-bottom: 16px;
    }

    .field-inline {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .hint {
      font-size: 11px;
      color: #ad6796;
      margin-top: 4px;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    button {
      border-radius: 999px;
      border: none;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.08s ease;
      white-space: nowrap;
    }

    .btn-primary {
      background: linear-gradient(135deg, #ff62b6, #ff3698);
      color: white;
      box-shadow: 0 8px 16px rgba(255, 78, 164, 0.35);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(255, 78, 164, 0.4);
    }

    .btn-secondary {
      background: #ffe5f4;
      color: #a83477;
      border: 1px solid #f7b3dd;
    }

    .btn-secondary:hover {
      background: #ffd7f0;
    }

    .status {
      font-size: 12px;
      color: #8a3f6d;
      margin-top: 6px;
      min-height: 16px;
    }

    /* Preview / "iPhone" mock */

    .phone-shell {
      margin: auto;
      background: linear-gradient(145deg, #242424, #050505);
      border-radius: 40px;
      padding: 14px;
      width: 100%;
      max-width: 320px;
      box-shadow:
        0 14px 30px rgba(0, 0, 0, 0.55),
        0 0 0 8px rgba(255, 255, 255, 0.16);
      position: relative;
    }

    .phone-notch {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 40%;
      height: 14px;
      background: #000;
      border-radius: 0 0 16px 16px;
    }

    .phone-screen {
      background: linear-gradient(180deg, #fee8f5 0%, #f6d8f0 35%, #f6e2ff 100%);
      border-radius: 28px;
      padding: 10px 8px 14px;
      position: relative;
      overflow: hidden;
      min-height: 420px;
      display: flex;
      flex-direction: column;
    }

    .phone-status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 10px 8px;
      font-size: 11px;
      color: #5a2143;
      opacity: 0.9;
    }

    .phone-status-bar .time {
      font-weight: 600;
    }

    .phone-status-bar .right {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .phone-status-bar .pill {
      width: 12px;
      height: 6px;
      border-radius: 999px;
      background: #5a2143;
    }

    .chat-header {
      background: #fbe5f7cc;
      margin: 0 6px;
      border-radius: 16px;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #5a2143;
      margin-bottom: 4px;
    }

    .chat-header-avatar {
      width: 18px;
      height: 18px;
      border-radius: 999px;
      background: linear-gradient(135deg, #ff74c0, #ff3b9b);
    }

    .chat-header .name {
      font-weight: 600;
    }

    .chat-area {
      flex: 1;
      padding: 6px 6px 10px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 4px;
      font-size: 13px;
    }

    .text-bubble {
      display: inline-block;
      max-width: 78%;
      padding: 7px 10px;
      border-radius: 16px 16px 4px 16px;
      font-size: 13px;
      line-height: 1.35;
      word-wrap: break-word;
      word-break: break-word;
      color: #4b1030;
      position: relative;
    }

    .bubble-outgoing {
      align-self: flex-end;
      background: linear-gradient(135deg, #ff75c1, #ff3e9e);
      color: white;
      border-radius: 16px 16px 4px 16px;
      box-shadow: 0 3px 6px rgba(255, 82, 159, 0.45);
    }

    .bubble-incoming {
      align-self: flex-start;
      background: #ffe6f6;
      border-radius: 16px 16px 16px 4px;
      color: #4b1030;
    }

    .bubble-meta {
      font-size: 9px;
      color: #7e3b60;
      margin-top: 2px;
      text-align: right;
      opacity: 0.9;
    }

    .chat-input-bar {
      margin-top: 8px;
      padding: 4px 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chat-input-fake {
      flex: 1;
      background: white;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 11px;
      color: #b27ca1;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .chat-input-dot {
      width: 5px;
      height: 5px;
      border-radius: 999px;
      background: #b27ca1;
    }

    .chat-send-btn {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      background: linear-gradient(135deg, #ff7acb, #ff3fa0);
    }

    /* Canvas (hidden) */
    #renderCanvas {
      display: none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- Left: Controls -->
    <div class="panel-left">
      <div class="title">Pink iMessage Generator</div>
      <div class="subtitle">
        Type a message, see it as a pink chat bubble, and download it as an image.
      </div>

      <div class="field-group">
        <div class="label">Message text</div>
        <textarea id="messageInput" placeholder="Type your iMessage here…">You’re doing better than you think. 💕</textarea>
        <div class="hint">This will be shown as a pink outgoing bubble.</div>
      </div>

      <div class="field-inline">
        <div>
          <div class="label">Contact name</div>
          <input type="text" id="contactNameInput" placeholder="e.g., Nicole" value="Bestie" />
        </div>
        <div>
          <div class="label">Time (optional)</div>
          <input type="text" id="timeInput" placeholder="e.g., 9:41 AM" value="9:41 AM" />
        </div>
      </div>

      <div class="btn-row">
        <button class="btn-primary" id="updatePreviewBtn">
          <span>Update preview</span>
        </button>
        <button class="btn-secondary" id="downloadBtn">
          <span>Download image</span>
        </button>
      </div>

      <div class="status" id="statusText"></div>
    </div>

    <!-- Right: Preview -->
    <div class="panel-right">
      <div class="phone-shell">
        <div class="phone-notch"></div>
        <div class="phone-screen" id="phoneScreen">
          <div class="phone-status-bar">
            <div class="time" id="statusTime">9:41</div>
            <div class="right">
              <div class="pill"></div>
              <div class="pill" style="width: 8px;"></div>
              <div class="pill" style="width: 16px;"></div>
            </div>
          </div>

          <div class="chat-header">
            <div class="chat-header-avatar"></div>
            <div class="name" id="headerName">Bestie</div>
            <div style="font-size: 11px; opacity: 0.7;">iMessage</div>
          </div>

          <div class="chat-area" id="chatArea">
            <div class="text-bubble bubble-incoming">
              omg tell me everything 👀
              <div class="bubble-meta">Read</div>
            </div>

            <div class="text-bubble bubble-outgoing" id="bubbleText">
              You’re doing better than you think. 💕
              <div class="bubble-meta" id="bubbleMetaTime">9:41 AM</div>
            </div>
          </div>

          <div class="chat-input-bar">
            <div class="chat-input-fake">
              <div class="chat-input-dot"></div>
              <div class="chat-input-dot"></div>
              <div class="chat-input-dot"></div>
              <span>iMessage</span>
            </div>
            <div class="chat-send-btn"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Hidden canvas for export -->
  <canvas id="renderCanvas" width="750" height="1624"></canvas>

  <script>
    const messageInput = document.getElementById("messageInput");
    const contactNameInput = document.getElementById("contactNameInput");
    const timeInput = document.getElementById("timeInput");
    const updatePreviewBtn = document.getElementById("updatePreviewBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const statusText = document.getElementById("statusText");

    const bubbleText = document.getElementById("bubbleText");
    const bubbleMetaTime = document.getElementById("bubbleMetaTime");
    const headerName = document.getElementById("headerName");
    const statusTime = document.getElementById("statusTime");

    const canvas = document.getElementById("renderCanvas");
    const ctx = canvas.getContext("2d");

    function updatePreview() {
      const msg = messageInput.value.trim() || "You’re doing better than you think. 💕";
      const name = contactNameInput.value.trim() || "Bestie";
      const time = timeInput.value.trim() || "9:41 AM";

      // Update DOM preview
      const escaped = msg.replace(/\n/g, "<br>");
      bubbleText.innerHTML = escaped + `<div class="bubble-meta" id="bubbleMetaTime">${time}</div>`;
      headerName.textContent = name;
      bubbleMetaTime.textContent = time;

      // Status bar time: just hours & minutes if user uses "9:41 AM"
      const shortTime = time.split(" ")[0] || time;
      statusTime.textContent = shortTime;

      statusText.textContent = "Preview updated.";
      setTimeout(() => (statusText.textContent = ""), 1600);
    }

    updatePreviewBtn.addEventListener("click", updatePreview);

    // Auto-update on typing
    messageInput.addEventListener("input", () => {
      updatePreview();
    });
    contactNameInput.addEventListener("input", () => {
      updatePreview();
    });
    timeInput.addEventListener("input", () => {
      updatePreview();
    });

    function downloadImage() {
      statusText.textContent = "Rendering image…";

      // Basic rendering to canvas: simple, not pixel-perfect iOS, but close enough.

      const w = canvas.width;
      const h = canvas.height;

      // Background gradient
      const bgGrad = ctx.createLinearGradient(0, 0, w, h);
      bgGrad.addColorStop(0, "#fee8f5");
      bgGrad.addColorStop(0.4, "#f6d8f0");
      bgGrad.addColorStop(1, "#f6e2ff");
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, w, h);

      // Helper to draw rounded rectangle
      function roundRect(x, y, width, height, radius) {
        const r = radius;
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + width - r, y);
        ctx.quadraticCurveTo(x + width, y, x + width, y + r);
        ctx.lineTo(x + width, y + height - r);
        ctx.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
        ctx.lineTo(x + r, y + height);
        ctx.quadraticCurveTo(x, y + height, x, y + height - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
      }

      // Draw status bar (simplified)
      ctx.fillStyle = "rgba(251,229,247,0.9)";
      roundRect(0, 0, w, 80, 0);
      ctx.fill();

      ctx.fillStyle = "#5a2143";
      ctx.font = "bold 32px -apple-system, system-ui, sans-serif";
      ctx.textBaseline = "top";
      ctx.fillText(statusTime.textContent || "9:41", 40, 24);

      // Contact header bubble
      ctx.font = "20px -apple-system, system-ui, sans-serif";
      const headerX = 40;
      const headerY = 90;
      const headerW = w - 80;
      const headerH = 60;
      ctx.fillStyle = "rgba(251,229,247,0.85)";
      roundRect(headerX, headerY, headerW, headerH, 18);
      ctx.fill();

      // Avatar
      const avatarRadius = 18;
      const avatarCenterX = headerX + avatarRadius + 12;
      const avatarCenterY = headerY + headerH / 2;
      const avatarGrad = ctx.createLinearGradient(
        avatarCenterX - avatarRadius,
        avatarCenterY - avatarRadius,
        avatarCenterX + avatarRadius,
        avatarCenterY + avatarRadius
      );
      avatarGrad.addColorStop(0, "#ff74c0");
      avatarGrad.addColorStop(1, "#ff3b9b");
      ctx.beginPath();
      ctx.arc(avatarCenterX, avatarCenterY, avatarRadius, 0, Math.PI * 2);
      ctx.fillStyle = avatarGrad;
      ctx.fill();

      // Name + "iMessage"
      ctx.fillStyle = "#5a2143";
      ctx.font = "600 22px -apple-system, system-ui, sans-serif";
      ctx.fillText(headerName.textContent || "Bestie", avatarCenterX + 28, headerY + 16);

      ctx.font = "14px -apple-system, system-ui, sans-serif";
      ctx.globalAlpha = 0.7;
      ctx.fillText("iMessage", avatarCenterX + 28, headerY + 38);
      ctx.globalAlpha = 1.0;

      // Incoming bubble (small)
      const incomingText = "omg tell me everything 👀";
      ctx.font = "18px -apple-system, system-ui, sans-serif";
      const maxBubbleWidth = w * 0.7;
      const incomingLines = wrapText(ctx, incomingText, maxBubbleWidth - 32);
      const lineHeight = 24;
      const incomingBubbleHeight = 16 + incomingLines.length * lineHeight + 10;
      const incomingX = headerX + 4;
      const incomingY = headerY + headerH + 30;

      ctx.fillStyle = "#ffe6f6";
      roundRect(incomingX, incomingY, maxBubbleWidth, incomingBubbleHeight, 22);
      ctx.fill();

      ctx.fillStyle = "#4b1030";
      let textY = incomingY + 16;
      incomingLines.forEach((line) => {
        ctx.fillText(line, incomingX + 16, textY);
        textY += lineHeight;
      });

      // Outgoing pink bubble
      const msg = messageInput.value.trim() || "You’re doing better than you think. 💕";
      const msgTime = timeInput.value.trim() || "9:41 AM";
      ctx.font = "18px -apple-system, system-ui, sans-serif";
      const msgLines = wrapText(ctx, msg, maxBubbleWidth - 32);
      const outgoingLineHeight = 24;
      const textHeight = msgLines.length * outgoingLineHeight;
      const metaHeight = 18;
      const outgoingBubbleHeight = 16 + textHeight + metaHeight + 10;
      const outgoingWidth = maxBubbleWidth;
      const outgoingX = w - headerX - outgoingWidth;
      const outgoingY = incomingY + incomingBubbleHeight + 40;

      // Pink gradient
      const bubbleGrad = ctx.createLinearGradient(
        outgoingX,
        outgoingY,
        outgoingX + outgoingWidth,
        outgoingY + outgoingBubbleHeight
      );
      bubbleGrad.addColorStop(0, "#ff75c1");
      bubbleGrad.addColorStop(1, "#ff3e9e");
      ctx.fillStyle = bubbleGrad;
      roundRect(outgoingX, outgoingY, outgoingWidth, outgoingBubbleHeight, 22);
      ctx.shadowColor = "rgba(255, 82, 159, 0.45)";
      ctx.shadowBlur = 12;
      ctx.shadowOffsetY = 4;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.shadowOffsetY = 0;

      // Bubble text
      ctx.fillStyle = "white";
      let outTextY = outgoingY + 18;
      msgLines.forEach((line) => {
        ctx.fillText(line, outgoingX + 16, outTextY);
        outTextY += outgoingLineHeight;
      });

      // Meta time
      ctx.font = "12px -apple-system, system-ui, sans-serif";
      ctx.textAlign = "right";
      ctx.fillText(msgTime, outgoingX + outgoingWidth - 12, outgoingY + outgoingBubbleHeight - 14);
      ctx.textAlign = "left";

      // Chat input bar hint (tiny)
      ctx.font = "14px -apple-system, system-ui, sans-serif";
      ctx.fillStyle = "rgba(178,124,161,0.8)";
      ctx.fillText("iMessage", headerX + 8, h - 40);

      // Download
      const dataURL = canvas.toDataURL("image/png");
      const link = document.createElement("a");
      link.href = dataURL;
      const safeName = (headerName.textContent || "imessage").replace(/[^\w\-]+/g, "_");
      link.download = `pink-imessage-${safeName}.png`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      statusText.textContent = "Image downloaded.";
      setTimeout(() => (statusText.textContent = ""), 2000);
    }

    // Simple text wrapping helper
    function wrapText(context, text, maxWidth) {
      const words = text.split(" ");
      const lines = [];
      let line = "";

      for (let i = 0; i < words.length; i++) {
        const testLine = line + words[i] + " ";
        const metrics = context.measureText(testLine);
        const testWidth = metrics.width;
        if (testWidth > maxWidth && i > 0) {
          lines.push(line.trim());
          line = words[i] + " ";
        } else {
          line = testLine;
        }
      }
      lines.push(line.trim());
      return lines;
    }

    downloadBtn.addEventListener("click", downloadImage);

    // Initial preview sync
    updatePreview();
  </script>
</body>
</html>
