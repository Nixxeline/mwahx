<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>iMessage Screenshot Generator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  :root {
    --screen-width: 393px;
    --bg-app: #f2f2f7;
    --bg-chat: #ffffff;
    --bubble-pink: #ffd1e8;
    --timestamp: #8e8e93;
    --text-main: #000000;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 24px 8px 40px;
    background: var(--bg-app);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: var(--text-main);
  }

  h1 {
    font-size: 18px;
    margin: 0 0 14px;
    font-weight: 600;
  }

  .controls {
    max-width: 900px;
    width: 100%;
    margin-bottom: 18px;
    padding: 12px 16px;
    border-radius: 16px;
    background: #ffffff;
    box-shadow: 0 6px 18px rgba(0,0,0,0.06);
    display: grid;
    grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
    gap: 12px 18px;
    font-size: 13px;
  }

  @media (max-width: 720px) {
    .controls {
      grid-template-columns: 1fr;
    }
  }

  .control-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .control-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    opacity: 0.75;
  }

  .control-group input,
  .control-group textarea {
    border-radius: 10px;
    border: 1px solid #d0d0d4;
    padding: 7px 9px;
    font-size: 13px;
    outline: none;
    resize: vertical;
  }

  .control-group textarea {
    min-height: 70px;
  }

  .control-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-top: 6px;
  }

  button {
    border-radius: 999px;
    border: none;
    padding: 7px 14px;
    font-size: 13px;
    cursor: pointer;
    background: #e5e5ea;
  }

  button.primary {
    background: #007aff;
    color: #ffffff;
  }

  .status-text {
    font-size: 11px;
    opacity: 0.7;
    margin-top: 4px;
  }

  /* Chat "screenshot" area */

  .screen-wrapper {
    background: transparent;
    display: flex;
    justify-content: center;
    width: 100%;
  }

  /* This is what will be captured as the screenshot */
  .screen {
    width: var(--screen-width);
    background: var(--bg-chat);
    color: var(--text-main);
    /* No border, no radius, no shadow – pure screenshot */
  }

  /* Status bar – simplified but believable */
  .status-bar {
    height: 20px;
    padding: 4px 10px 0;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    font-size: 12px;
  }

  .status-left {
    font-weight: 500;
  }

  .status-right {
    display: flex;
    gap: 6px;
    align-items: center;
    font-size: 10px;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #000;
  }

  .battery {
    width: 18px;
    height: 10px;
    border-radius: 2px;
    border: 1.2px solid #000;
    position: relative;
  }

  .battery::after {
    content: "";
    position: absolute;
    right: -3px;
    top: 2px;
    width: 2px;
    height: 6px;
    border-radius: 1px;
    background: #000;
  }

  .battery-level {
    position: absolute;
    left: 1px;
    top: 1px;
    bottom: 1px;
    width: 70%;
    background: #000;
    border-radius: 1px;
  }

  /* Navigation / Messages header */
  .nav-bar {
    height: 44px;
    display: flex;
    align-items: center;
    padding: 0 8px 0 8px;
  }

  .nav-left,
  .nav-right {
    width: 80px;
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 15px;
  }

  .nav-left {
    color: #007aff;
  }

  .nav-back-chevron {
    font-size: 20px;
    margin-top: -2px;
  }

  .nav-center {
    flex: 1;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 1px;
    align-items: center;
  }

  .contact-photo {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #fec7d7;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 15px;
    color: #ffffff;
    margin-bottom: 1px;
  }

  .contact-name {
    font-size: 17px;
    font-weight: 600; /* SF Pro Display Semibold */
    line-height: 1.1;
  }

  .contact-subtitle {
    font-size: 11px;
    color: #8e8e93;
  }

  .nav-right {
    justify-content: flex-end;
    color: #007aff;
    gap: 10px;
  }

  .nav-circle {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 1.4px solid #007aff;
  }

  /* Chat area */
  .chat {
    padding: 4px 12px 12px;
  }

  .timestamp {
    font-size: 12px;
    color: var(--timestamp);
    text-align: center;
    margin: 10px 0 14px;
  }

  .bubble {
    max-width: calc(var(--screen-width) * 0.75);
    font-size: 17px; /* SF Pro Text 17 */
    line-height: 1.3;
    padding: 8px 13px;
    margin-bottom: 6px;
    display: inline-block;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .bubble-incoming {
    background: var(--bubble-pink);
    color: var(--text-main);
    border-radius: 18px 18px 18px 6px; /* bottom-left 6px */
    margin-right: auto;
  }

  /* Typing indicator */
  .typing-container {
    margin-top: 4px;
    margin-bottom: 6px;
    display: none;
  }

  .typing-bubble {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 6px 9px;
    border-radius: 16px;
    background: #e5e5ea;
  }

  .typing-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #8e8e93;
    animation: blink 1s infinite;
  }

  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 80%, 100% { opacity: 0.3; }
    40% { opacity: 1; }
  }

  /* Fake bottom input bar */
  .input-bar {
    height: 44px;
    padding: 4px 8px 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .input-pill {
    flex: 1;
    background: #f2f2f7;
    border-radius: 18px;
    height: 32px;
  }

  .mic-circle {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #007aff;
  }
</style>
</head>

<body>

<h1>iMessage Screenshot Generator</h1>

<div class="controls">
  <div class="control-group">
    <div class="control-label">Contact name</div>
    <input id="contactNameInput" type="text" value="Custom contact">
    <div class="control-label" style="margin-top:8px;">Contact initials</div>
    <input id="initialsInput" type="text" value="C" maxlength="3">
    <div class="status-text">This appears in the top header and avatar.</div>
  </div>

  <div class="control-group">
    <div class="control-label">Pink incoming messages (one per line)</div>
    <textarea id="incomingMessagesInput" placeholder="Type one message per line"></textarea>
    <div class="control-row">
      <button class="primary" id="applyMessagesBtn">Apply messages</button>
      <button id="toggleTypingBtn">Typing bubble off</button>
      <button class="primary" id="downloadBtn">Download PNG</button>
    </div>
    <div class="status-text" id="statusText"></div>
  </div>
</div>

<!-- Screenshot area -->
<div class="screen-wrapper">
  <div class="screen" id="screenshotArea">
    <!-- Status bar -->
    <div class="status-bar">
      <div class="status-left" id="statusTime">9:41</div>
      <div class="status-right">
        <div class="status-dot"></div>
        <div class="status-dot"></div>
        <div class="battery">
          <div class="battery-level"></div>
        </div>
      </div>
    </div>

    <!-- Nav / header -->
    <div class="nav-bar">
      <div class="nav-left">
        <span class="nav-back-chevron">‹</span>
        <span>Messages</span>
      </div>
      <div class="nav-center">
        <div class="contact-photo" id="contactPhoto">C</div>
        <div class="contact-name" id="contactNameDisplay">Custom contact</div>
        <div class="contact-subtitle">iMessage</div>
      </div>
      <div class="nav-right">
        <div class="nav-circle"></div>
        <div class="nav-circle"></div>
      </div>
    </div>

    <!-- Chat -->
    <div class="chat" id="chatArea">
      <div class="timestamp" id="timestampDisplay">Today 9:41 AM</div>

      <!-- Default single incoming bubble -->
      <div class="bubble bubble-incoming">
You’re doing better than you think.
      </div>

      <!-- Typing indicator -->
      <div class="typing-container" id="typingContainer">
        <div class="typing-bubble">
          <span class="typing-dot"></span>
          <span class="typing-dot"></span>
          <span class="typing-dot"></span>
        </div>
      </div>
    </div>

    <!-- Bottom input bar -->
    <div class="input-bar">
      <div class="input-pill"></div>
      <div class="mic-circle"></div>
    </div>
  </div>
</div>

<!-- html2canvas for screenshot -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
  const contactNameInput = document.getElementById("contactNameInput");
  const initialsInput = document.getElementById("initialsInput");
  const incomingMessagesInput = document.getElementById("incomingMessagesInput");

  const contactNameDisplay = document.getElementById("contactNameDisplay");
  const contactPhoto = document.getElementById("contactPhoto");
  const timestampDisplay = document.getElementById("timestampDisplay");

  const chatArea = document.getElementById("chatArea");
  const typingContainer = document.getElementById("typingContainer");
  const toggleTypingBtn = document.getElementById("toggleTypingBtn");
  const statusText = document.getElementById("statusText");

  const applyMessagesBtn = document.getElementById("applyMessagesBtn");
  const downloadBtn = document.getElementById("downloadBtn");
  const screenshotArea = document.getElementById("screenshotArea");

  // Update header with contact info
  function updateHeader() {
    const name = contactNameInput.value.trim() || "Custom contact";
    const initials = (initialsInput.value.trim() || name.charAt(0) || "C").toUpperCase();

    contactNameDisplay.textContent = name;
    contactPhoto.textContent = initials.slice(0, 3);
  }

  contactNameInput.addEventListener("input", updateHeader);
  initialsInput.addEventListener("input", updateHeader);

  // Apply incoming messages
  applyMessagesBtn.addEventListener("click", () => {
    const text = incomingMessagesInput.value.trim();

    // Remove existing incoming bubbles (keep timestamp + typing container)
    const oldBubbles = chatArea.querySelectorAll(".bubble-incoming");
    oldBubbles.forEach(b => b.remove());

    const referenceNode = typingContainer;

    if (!text) {
      // Restore default message if empty
      const div = document.createElement("div");
      div.className = "bubble bubble-incoming";
      div.textContent = "You’re doing better than you think.";
      chatArea.insertBefore(div, referenceNode);
      setStatus("Using default incoming message.");
      return;
    }

    const lines = text.split("\n").map(l => l.trim()).filter(l => l !== "");
    if (!lines.length) {
      const div = document.createElement("div");
      div.className = "bubble bubble-incoming";
      div.textContent = "You’re doing better than you think.";
      chatArea.insertBefore(div, referenceNode);
      setStatus("Using default incoming message.");
      return;
    }

    lines.forEach(line => {
      const div = document.createElement("div");
      div.className = "bubble bubble-incoming";
      div.textContent = line;
      chatArea.insertBefore(div, referenceNode);
    });

    setStatus("Incoming messages updated.");
  });

  // Typing bubble toggle
  let typingOn = false;
  toggleTypingBtn.addEventListener("click", () => {
    typingOn = !typingOn;
    typingContainer.style.display = typingOn ? "block" : "none";
    toggleTypingBtn.textContent = typingOn ? "Typing bubble on" : "Typing bubble off";
  });

  // Download screenshot as PNG
  downloadBtn.addEventListener("click", () => {
    setStatus("Rendering PNG...");
    html2canvas(screenshotArea, {
      backgroundColor: null,
      scale: 2
    }).then(canvas => {
      canvas.toBlob(blob => {
        const link = document.createElement("a");
        const safeName = (contactNameInput.value.trim() || "imessage").replace(/[^\w\-]+/g, "_");
        link.href = URL.createObjectURL(blob);
        link.download = "imessage_" + safeName + ".png";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setStatus("PNG downloaded.");
      });
    }).catch(() => {
      setStatus("Something went wrong generating the image.");
    });
  });

  function setStatus(msg) {
    statusText.textContent = msg;
    if (!msg) return;
    setTimeout(() => {
      if (statusText.textContent === msg) {
        statusText.textContent = "";
      }
    }, 2000);
  }

  // Initialize header
  updateHeader();
</script>
</body>
</html>
