<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>iMessage Generator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
    :root {
        --bg-light: #f2f2f7;
        --bg-dark: #000000;
        --chat-bg-light: #ffffff;
        --chat-bg-dark: #000000;
        --incoming-pink: #ffd1e8;
        --outgoing-gray: #e5e5ea;
        --timestamp-light: #8e8e93;
        --timestamp-dark: #8e8e93;
        --text-light: #000000;
        --text-dark: #ffffff;
    }

    body {
        background: var(--bg-light);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
        display: flex;
        justify-content: center;
        padding: 30px 10px 60px;
    }

    body.dark {
        background: var(--bg-dark);
        color: var(--text-dark);
    }

    .layout {
        max-width: 960px;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
    }

    .top-controls {
        background: #ffffff;
        border-radius: 18px;
        padding: 14px 16px;
        width: 100%;
        max-width: 700px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.06);
        display: flex;
        flex-wrap: wrap;
        gap: 10px 18px;
        align-items: center;
    }

    body.dark .top-controls {
        background: #111111;
        color: #ffffff;
        box-shadow: 0 12px 28px rgba(0,0,0,0.7);
    }

    .control-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 13px;
    }

    .control-group label {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        opacity: 0.8;
    }

    .control-group input,
    .control-group select {
        border-radius: 10px;
        border: 1px solid #d0d0d4;
        padding: 6px 8px;
        font-size: 13px;
        min-width: 140px;
        outline: none;
    }

    body.dark .control-group input,
    body.dark .control-group select {
        background: #1c1c1e;
        color: #ffffff;
        border-color: #3a3a3c;
    }

    .toggle-row {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 13px;
        flex-wrap: wrap;
    }

    .toggle-row button {
        padding: 7px 14px;
        border-radius: 999px;
        border: none;
        font-size: 13px;
        cursor: pointer;
        background: #e5e5ea;
    }

    body.dark .toggle-row button {
        background: #2c2c2e;
        color: #ffffff;
    }

    .toggle-row button.active {
        background: #007aff;
        color: #ffffff;
    }

    .btn-main {
        background: #007aff;
        color: #ffffff;
    }

    /* iPhone shell */
    .iphone {
        width: 390px;
        background: var(--chat-bg-light);
        border-radius: 40px;
        padding-top: 18px;
        box-shadow: 0 0 0 12px #00000015, 0 20px 40px rgba(0,0,0,0.3);
        overflow: hidden;
        position: relative;
    }

    body.dark .iphone {
        background: var(--chat-bg-dark);
        box-shadow: 0 0 0 12px #000000, 0 24px 50px rgba(0,0,0,0.9);
    }

    .notch {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        width: 126px;
        height: 28px;
        background: #000;
        border-radius: 40px;
    }

    /* Header */
    .header {
        text-align: center;
        padding: 22px 0 10px;
        border-bottom: 1px solid #e5e5ea;
        position: relative;
    }

    body.dark .header {
        border-bottom-color: #262629;
    }

    .contact-photo {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: #FEC7D7;
        color: white;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        position: absolute;
        left: 16px;
        bottom: 6px;
        font-size: 16px;
    }

    .contact-name {
        font-size: 17px;
        font-weight: 600;
    }

    /* Chat area */
    .chat-wrapper {
        height: 640px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    .chat {
        padding: 10px 12px 16px;
        flex: 1;
        overflow-y: auto;
    }

    .timestamp {
        font-size: 12px;
        color: var(--timestamp-light);
        text-align: center;
        margin: 10px 0 14px;
    }

    body.dark .timestamp {
        color: var(--timestamp-dark);
    }

    .bubble {
        max-width: 75%;
        padding: 9px 14px;
        border-radius: 18px;
        font-size: 16px;
        line-height: 1.3;
        margin-bottom: 8px;
        white-space: pre-wrap;
        word-wrap: break-word;
    }

    .incoming {
        background: var(--incoming-pink);
        color: var(--text-light);
        border-bottom-left-radius: 4px;
    }

    .outgoing {
        background: var(--outgoing-gray);
        color: var(--text-light);
        margin-left: auto;
        border-bottom-right-radius: 4px;
    }

    body.dark .incoming {
        background: #ff9ac9;
        color: #000;
    }

    body.dark .outgoing {
        background: #3a3a3c;
        color: #fff;
    }

    /* Typing bubble */
    .typing-container {
        margin-top: 4px;
        margin-bottom: 8px;
        display: none;
    }

    .typing-bubble {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        padding: 6px 9px;
        border-radius: 16px;
        background: var(--incoming-pink);
        color: #555;
        font-size: 14px;
    }

    body.dark .typing-bubble {
        background: #ff9ac9;
    }

    .typing-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #888;
        animation: blink 1s infinite;
    }

    .typing-dot:nth-child(2) {
        animation-delay: 0.2s;
    }

    .typing-dot:nth-child(3) {
        animation-delay: 0.4s;
    }

    @keyframes blink {
        0%, 80%, 100% { opacity: 0.3; }
        40% { opacity: 1; }
    }

    /* Bottom input bar visual */
    .bottom-bar {
        border-top: 1px solid #e5e5ea;
        padding: 6px 10px 12px;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    body.dark .bottom-bar {
        border-top-color: #262629;
    }

    .fake-input {
        flex: 1;
        border-radius: 18px;
        background: #f2f2f7;
        padding: 6px 10px;
        font-size: 14px;
        color: #8e8e93;
    }

    body.dark .fake-input {
        background: #1c1c1e;
        color: #8e8e93;
    }

    .send-circle {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: #007aff;
    }

    /* Lower controls for messages and download */
    .bottom-controls {
        margin-top: 10px;
        width: 100%;
        max-width: 700px;
        background: #ffffff;
        border-radius: 16px;
        padding: 14px 16px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.06);
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 14px;
        font-size: 13px;
    }

    body.dark .bottom-controls {
        background: #111111;
        color: #ffffff;
        box-shadow: 0 12px 28px rgba(0,0,0,0.8);
    }

    .bottom-controls textarea {
        width: 100%;
        min-height: 70px;
        border-radius: 10px;
        border: 1px solid #d0d0d4;
        padding: 8px;
        font-size: 14px;
        resize: vertical;
        outline: none;
    }

    body.dark .bottom-controls textarea {
        background: #1c1c1e;
        color: #ffffff;
        border-color: #3a3a3c;
    }

    .bottom-controls button {
        margin-top: 6px;
        padding: 8px 14px;
        border-radius: 999px;
        border: none;
        font-size: 13px;
        cursor: pointer;
        background: #e5e5ea;
    }

    body.dark .bottom-controls button {
        background: #2c2c2e;
        color: #ffffff;
    }

    .bottom-controls button.primary {
        background: #007aff;
        color: #ffffff;
    }

    .status-text {
        font-size: 12px;
        opacity: 0.8;
        margin-top: 4px;
    }

    @media (max-width: 840px) {
        .bottom-controls {
            grid-template-columns: 1fr;
        }
    }

</style>
</head>

<body>

<div class="layout">

    <!-- Top controls -->
    <div class="top-controls">
        <div class="control-group">
            <label for="contactName">Contact name</label>
            <input id="contactName" type="text" value="Nicole">
        </div>

        <div class="control-group">
            <label for="initials">Initials</label>
            <input id="initials" type="text" value="N" maxlength="3">
        </div>

        <div class="control-group">
            <label for="photoColor">Photo color</label>
            <select id="photoColor">
                <option value="#FEC7D7">Soft pink</option>
                <option value="#D7C7FE">Lilac</option>
                <option value="#C7E2FE">Sky blue</option>
                <option value="#C7FEE0">Mint</option>
                <option value="#FEEFC7">Pastel yellow</option>
            </select>
        </div>

        <div class="control-group">
            <label for="timeText">Timestamp</label>
            <input id="timeText" type="text" value="Today 9:41 AM">
        </div>

        <div class="toggle-row">
            <button id="lightModeBtn" class="active">Light mode</button>
            <button id="darkModeBtn">Dark mode</button>
            <button id="typingToggleBtn">Typing bubble off</button>
            <button id="downloadBtn" class="btn-main">Download PNG</button>
        </div>
    </div>

    <!-- iPhone preview -->
    <div class="iphone" id="iphonePreview">
        <div class="notch"></div>

        <div class="header">
            <div class="contact-photo" id="contactPhoto">N</div>
            <div class="contact-name" id="contactNameDisplay">Nicole</div>
        </div>

        <div class="chat-wrapper">
            <div class="chat" id="chatArea">
                <div class="timestamp" id="timestampText">Today 9:41 AM</div>

                <!-- Incoming pink (custom) -->
                <div class="incoming bubble" id="incomingBubble">
You’re doing better than you think. 💕
                </div>

                <!-- Outgoing gray (custom) -->
                <div class="outgoing bubble" id="outgoingBubble">
omg tell me everything 👀
                </div>

                <!-- Typing bubble -->
                <div class="typing-container" id="typingContainer">
                    <div class="typing-bubble">
                        <span class="typing-dot"></span>
                        <span class="typing-dot"></span>
                        <span class="typing-dot"></span>
                    </div>
                </div>
            </div>

            <!-- Fake bottom bar -->
            <div class="bottom-bar">
                <div class="fake-input">iMessage</div>
                <div class="send-circle"></div>
            </div>
        </div>
    </div>

    <!-- Message controls -->
    <div class="bottom-controls">
        <div>
            <div>Pink incoming messages (one per line):</div>
            <textarea id="incomingText"></textarea>
            <button class="primary" id="applyIncomingBtn">Apply incoming</button>
            <div class="status-text">Leave blank to keep default.</div>
        </div>

        <div>
            <div>Gray outgoing message:</div>
            <textarea id="outgoingText"></textarea>
            <button class="primary" id="applyOutgoingBtn">Apply outgoing</button>
            <div class="status-text" id="statusMessage"></div>
        </div>
    </div>

</div>

<!-- html2canvas for PNG download -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
    const bodyEl = document.body;

    const contactNameInput = document.getElementById("contactName");
    const initialsInput = document.getElementById("initials");
    const photoColorSelect = document.getElementById("photoColor");
    const timeTextInput = document.getElementById("timeText");

    const contactPhoto = document.getElementById("contactPhoto");
    const contactNameDisplay = document.getElementById("contactNameDisplay");
    const timestampText = document.getElementById("timestampText");

    const incomingTextArea = document.getElementById("incomingText");
    const outgoingTextArea = document.getElementById("outgoingText");
    const incomingBubble = document.getElementById("incomingBubble");
    const outgoingBubble = document.getElementById("outgoingBubble");

    const typingContainer = document.getElementById("typingContainer");
    const typingToggleBtn = document.getElementById("typingToggleBtn");

    const lightModeBtn = document.getElementById("lightModeBtn");
    const darkModeBtn = document.getElementById("darkModeBtn");

    const applyIncomingBtn = document.getElementById("applyIncomingBtn");
    const applyOutgoingBtn = document.getElementById("applyOutgoingBtn");
    const statusMessage = document.getElementById("statusMessage");

    const downloadBtn = document.getElementById("downloadBtn");
    const iphonePreview = document.getElementById("iphonePreview");

    // Contact + header updates
    function updateHeader() {
        const name = contactNameInput.value.trim() || "Nicole";
        const initials = initialsInput.value.trim().toUpperCase() || "N";
        const timeText = timeTextInput.value.trim() || "Today 9:41 AM";

        contactNameDisplay.textContent = name;
        contactPhoto.textContent = initials.slice(0, 3);
        timestampText.textContent = timeText;
        contactPhoto.style.backgroundColor = photoColorSelect.value;
    }

    contactNameInput.addEventListener("input", updateHeader);
    initialsInput.addEventListener("input", updateHeader);
    photoColorSelect.addEventListener("change", updateHeader);
    timeTextInput.addEventListener("input", updateHeader);

    // Incoming messages
    applyIncomingBtn.addEventListener("click", () => {
        const text = incomingTextArea.value.trim();

        if (!text) {
            incomingBubble.textContent = "You’re doing better than you think. 💕";
            return;
        }

        const lines = text.split("\n").filter(l => l.trim() !== "");
        const chatArea = document.getElementById("chatArea");

        // Remove existing incoming bubbles (except outgoing + typing)
        const oldIncoming = chatArea.querySelectorAll(".incoming.bubble");
        oldIncoming.forEach(b => b.remove());

        // Insert incoming messages before outgoing bubble
        const referenceNode = outgoingBubble;

        lines.forEach(line => {
            const div = document.createElement("div");
            div.className = "incoming bubble";
            div.textContent = line;
            chatArea.insertBefore(div, referenceNode);
        });

        statusMessage.textContent = "Incoming messages updated.";
        setTimeout(() => statusMessage.textContent = "", 1800);
    });

    // Outgoing message
    applyOutgoingBtn.addEventListener("click", () => {
        const text = outgoingTextArea.value.trim() || "omg tell me everything 👀";
        outgoingBubble.textContent = text;
        statusMessage.textContent = "Outgoing message updated.";
        setTimeout(() => statusMessage.textContent = "", 1800);
    });

    // Typing bubble toggle
    let typingOn = false;
    typingToggleBtn.addEventListener("click", () => {
        typingOn = !typingOn;
        typingContainer.style.display = typingOn ? "block" : "none";
        typingToggleBtn.textContent = typingOn ? "Typing bubble on" : "Typing bubble off";
    });

    // Light / dark mode
    lightModeBtn.addEventListener("click", () => {
        bodyEl.classList.remove("dark");
        lightModeBtn.classList.add("active");
        darkModeBtn.classList.remove("active");
    });

    darkModeBtn.addEventListener("click", () => {
        bodyEl.classList.add("dark");
        darkModeBtn.classList.add("active");
        lightModeBtn.classList.remove("active");
    });

    // Download as PNG
    downloadBtn.addEventListener("click", () => {
        statusMessage.textContent = "Rendering image...";
        html2canvas(iphonePreview, {
            backgroundColor: null,
            scale: 2
        }).then(canvas => {
            canvas.toBlob(function(blob) {
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                const safeName = (contactNameInput.value.trim() || "imessage").replace(/[^\w\-]+/g, "_");
                link.download = "imessage_" + safeName + ".png";
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                statusMessage.textContent = "PNG downloaded.";
                setTimeout(() => statusMessage.textContent = "", 2000);
            });
        });
    });

    // Initialize header
    updateHeader();
</script>

</body>
</html>
